[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicleai"
version = "0.3.0"
description = "Local vehicle detection and crop collection pipeline"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "cuda: requires a CUDA-enabled PyTorch runtime and compatible GPU",
]
